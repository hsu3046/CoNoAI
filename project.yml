name: CoNo
options:
  bundleIdPrefix: space.knowai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  CoNo:
    type: application
    platform: macOS
    sources:
      - path: CoNo
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: CoNo
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 KnowAI (https://knowai.space) · GPL-3.0"
        # Core Audio process tap 권한 프롬프트 문구 (없으면 탭이 무음만 받는다)
        NSAudioCaptureUsageDescription: "스트리밍 앱의 소리를 노래방 반주로 바꾸기 위해 다른 앱의 오디오를 캡처합니다. 오디오는 저장되지 않습니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.knowai.cono
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # 로컬 PoC: ad-hoc 서명. 빌드마다 서명이 바뀌어 오디오 캡처 권한을 다시 물을 수 있다 (docs/SETUP.md)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
