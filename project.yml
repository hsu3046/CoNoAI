name: CoNo
options:
  bundleIdPrefix: space.knowai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # Icon Composer 아이콘(.icon)은 폴더가 아니라 파일로 다뤄야 actool 이 앱 아이콘으로 컴파일한다
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  CoNo:
    type: application
    platform: macOS
    sources:
      - path: CoNo
      # scripts/fetch-models.sh 로 받은 모델을 번들에 폴더째 넣는다 (없어도 빌드는 된다)
      - path: Models
        type: folder
        optional: true
        buildPhase: resources
      # 앱 아이콘 (Icon Composer). 이름 = ASSETCATALOG_COMPILER_APPICON_NAME
      - path: assets/AppIcon.icon
        buildPhase: resources
      # "지금 재생 중" 어댑터 스크립트 — /usr/bin/perl 이 번들의 MediaRemoteAdapter.framework 를 불러 쓴다
      - path: ThirdParty/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      # 링크하지 않고 번들(Contents/Frameworks)에 넣기만 한다 — 앱이 아니라 perl 이 불러 쓴다
      - target: MediaRemoteAdapter
        link: false
        embed: true
    # 서명: 기본 ad-hoc, 개인 팀은 Support/Signing.local.xcconfig (커밋 안 함) 로 덮어쓴다
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: CoNo
        # 버전은 아래 빌드 설정(MARKETING_VERSION·CURRENT_PROJECT_VERSION)을 따른다
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 KnowAI (https://knowai.space) · GPL-3.0"
        # Core Audio process tap 권한 프롬프트 문구 (없으면 탭이 무음만 받는다)
        NSAudioCaptureUsageDescription: "스트리밍 앱의 소리를 노래방 반주로 바꾸기 위해 다른 앱의 오디오를 캡처합니다. 오디오는 저장되지 않습니다."
        # Apple Music 의 곡 정보·재생 위치를 읽어 가사를 맞추기 위한 자동화 권한 문구
        NSAppleEventsUsageDescription: "가사를 노래에 맞추기 위해 음악 앱에서 재생 중인 곡 정보와 재생 위치를 읽습니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.knowai.cono
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
  # ThirdParty/mediaremote-adapter (BSD-3) — CMakeLists 와 같은 설정을 Xcode 로 옮긴 것
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: ThirdParty/mediaremote-adapter/src
      - path: ThirdParty/mediaremote-adapter/include
        headerVisibility: public
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_NAME: MediaRemoteAdapter
        PRODUCT_BUNDLE_IDENTIFIER: space.knowai.cono.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        # perl 스크립트가 프레임워크의 함수를 이름으로 부르므로 심볼을 숨기지 않는다
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        OTHER_CFLAGS: ["-fvisibility=default"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/ThirdParty/mediaremote-adapter/src", "$(SRCROOT)/ThirdParty/mediaremote-adapter/include"]
        DEFINES_MODULE: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
  CoNoTests:
    type: bundle.unit-test
    platform: macOS
    # 앱을 띄우지 않는 독립 테스트: 순수 DSP 코드만 직접 컴파일한다
    sources:
      - path: CoNoTests
      - path: CoNo/DSP
      - path: CoNo/Lyrics/Core
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CoNo:
    build:
      targets:
        CoNo: all
    test:
      targets:
        - CoNoTests
