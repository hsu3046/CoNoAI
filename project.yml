name: CoNo
options:
  bundleIdPrefix: space.knowai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
targets:
  CoNo:
    type: application
    platform: macOS
    sources:
      - path: CoNo
      # scripts/fetch-models.sh 로 받은 모델을 번들에 폴더째 넣는다 (없어도 빌드는 된다)
      - path: Models
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    # 서명: 기본 ad-hoc, 개인 팀은 Support/Signing.local.xcconfig (커밋 안 함) 로 덮어쓴다
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: CoNo
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 KnowAI (https://knowai.space) · GPL-3.0"
        # Core Audio process tap 권한 프롬프트 문구 (없으면 탭이 무음만 받는다)
        NSAudioCaptureUsageDescription: "스트리밍 앱의 소리를 노래방 반주로 바꾸기 위해 다른 앱의 오디오를 캡처합니다. 오디오는 저장되지 않습니다."
        # Apple Music 의 곡 정보·재생 위치를 읽어 가사를 맞추기 위한 자동화 권한 문구
        NSAppleEventsUsageDescription: "가사를 노래에 맞추기 위해 음악 앱에서 재생 중인 곡 정보와 재생 위치를 읽습니다."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.knowai.cono
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
  CoNoTests:
    type: bundle.unit-test
    platform: macOS
    # 앱을 띄우지 않는 독립 테스트: 순수 DSP 코드만 직접 컴파일한다
    sources:
      - path: CoNoTests
      - path: CoNo/DSP
      - path: CoNo/Lyrics/Core
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CoNo:
    build:
      targets:
        CoNo: all
    test:
      targets:
        - CoNoTests
